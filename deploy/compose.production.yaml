services:
  bot:
    image: quiz-duel:submission
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in your environment}
    volumes:
      - quiz-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quiz-data:
  caddy-data:
  caddy-config:
